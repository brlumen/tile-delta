name: Publish world overview

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
    inputs:
      source_date:
        description: Protomaps build date (YYYYMMDD). Leave blank for the latest available build.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: world-overview
  cancel-in-progress: false

env:
  PMTILES_KEEP_RELEASES: '2'
  PMTILES_BASE_HISTORY: '8'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select a new Protomaps build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DATE: ${{ inputs.source_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DATE" ]]; then
            [[ "$REQUESTED_DATE" =~ ^[0-9]{8}$ ]] || { echo 'Expected YYYYMMDD' >&2; exit 1; }
            dates=("$REQUESTED_DATE")
          else
            dates=()
            for offset in {0..6}; do dates+=("$(date -u -d "$offset days ago" +%Y%m%d)"); done
          fi
          source_date=''
          for candidate in "${dates[@]}"; do
            code=$(curl -sS --head --retry 2 --max-time 25 -o /dev/null -w '%{http_code}' \
              "https://build.protomaps.com/$candidate.pmtiles")
            case "$code" in
              200) source_date="$candidate"; break ;;
              404) ;;
              *) echo "Protomaps returned HTTP $code" >&2; exit 1 ;;
            esac
          done
          [[ -n "$source_date" ]] || { echo 'No Protomaps build found' >&2; exit 1; }
          tag="world-pmtiles-$source_date"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^world-pmtiles-[0-9]{8}$"))' \
            | sort -ru)
          latest=${published%%$'\n'*}
          if [[ -n "$latest" && ( "$tag" == "$latest" || "$tag" < "$latest" ) ]]; then
            echo "Overview is already at $latest"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/world-bases"
          if [[ -n "$latest" ]]; then
            history=$(gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.name == "world-base-indexes.zip") | .name')
            if [[ -n "$history" ]]; then
              gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern world-base-indexes.zip \
                --output "$RUNNER_TEMP/world-base-indexes.zip"
              python3 -m zipfile -e "$RUNNER_TEMP/world-base-indexes.zip" "$RUNNER_TEMP/world-bases"
            fi
          fi
          while IFS= read -r previous; do
            [[ -n "$previous" ]] || continue
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern world-index.pmi \
              --output "$RUNNER_TEMP/world-bases/$previous.pmi" --clobber
          done <<< "$(printf '%s\n' "$published" | sed -n "1,${PMTILES_BASE_HISTORY}p")"
          printf 'tag=%s\nsource_date=%s\n' "$tag" "$source_date" >> "$GITHUB_OUTPUT"

      - name: Build map and tile deltas
        if: steps.source.outputs.tag != ''
        env:
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
          TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pmtiles.tar.gz"
          curl -fsSL --retry 3 --max-time 120 \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            -o "$archive"
          printf '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  %s\n' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" pmtiles
          python3 -m venv "$RUNNER_TEMP/world-venv"
          python="$RUNNER_TEMP/world-venv/bin/python"
          "$python" -m pip install --disable-pip-version-check pmtiles==3.8.1 mapbox-vector-tile==2.2.0
          "$RUNNER_TEMP/pmtiles" extract "https://build.protomaps.com/$SOURCE_DATE.pmtiles" \
            "$RUNNER_TEMP/world.pmtiles" --maxzoom=9
          "$python" -B tools/world_roads.py "$RUNNER_TEMP/world.pmtiles" "$RUNNER_TEMP/world-roads.pmtiles"
          "$RUNNER_TEMP/pmtiles" verify "$RUNNER_TEMP/world-roads.pmtiles"
          shopt -s nullglob
          history=("$RUNNER_TEMP/world-bases/"world-pmtiles-????????.pmi)
          if (( ${#history[@]} > PMTILES_BASE_HISTORY )); then
            history=("${history[@]: -PMTILES_BASE_HISTORY}")
          fi
          bases=(seeds/*.pmi "${history[@]}")
          "$python" -B tools/world_road_release.py release "$RUNNER_TEMP/world-roads.pmtiles" \
            "$RUNNER_TEMP/world-release" "$TAG" "${bases[@]}"
          if (( ${#history[@]} )); then
            "$python" -m zipfile -c "$RUNNER_TEMP/world-release/world-base-indexes.zip" "${history[@]}"
          fi

      - name: Publish complete release
        if: steps.source.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
          TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/world-notes.md"
          cat > "$notes" <<EOF
          PMTiles v3 world overview with MVT tiles, zoom levels 0–9, from the [Protomaps build $SOURCE_DATE](https://maps.protomaps.com/builds/).

          © [OpenStreetMap contributors](https://www.openstreetmap.org/copyright) · [ODbL](https://opendatacommons.org/licenses/odbl/1-0/) · [Protomaps](https://protomaps.com/)
          EOF
          state=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")
          if [[ "$state" == false ]]; then
            echo "Release $TAG is already published"
            exit 0
          fi
          if [[ -z "$state" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "TileDelta world overview $SOURCE_DATE" --notes-file "$notes"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/world-release/"*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Retain the newest PMTiles releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^world-pmtiles-[0-9]{8}$"))' \
            | sort -ru)
          latest=${published%%$'\n'*}
          obsolete=$(printf '%s\n' "$published" | tail -n "+$((PMTILES_KEEP_RELEASES + 1))")
          if [[ -z "$obsolete" ]]; then
            echo "No old PMTiles releases to remove"
            exit 0
          fi

          active=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [[ "$active" != "$latest" ]]; then
            echo "Skipping cleanup while $active is marked latest instead of $latest"
            exit 0
          fi
          while IFS= read -r retained; do
            assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$retained" \
              --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')
            for required in world-roads.pmtiles world-index.pmi world-release.json; do
              if ! grep -Fxq "$required" <<< "$assets"; then
                echo "$retained is missing $required" >&2
                exit 1
              fi
            done
            # Save the indexes in a new release before deleting their original releases.
            if [[ "$retained" == "$latest" ]] && ! grep -Fxq world-base-indexes.zip <<< "$assets"; then
              echo "Waiting for a release that includes the base index history"
              exit 0
            fi
          done <<< "$(printf '%s\n' "$published" | sed -n "1,${PMTILES_KEEP_RELEASES}p")"

          while IFS= read -r previous; do
            gh release delete "$previous" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$obsolete"
